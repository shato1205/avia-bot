name: Проверка цен

on:
  schedule:
    - cron: "17 */2 * * *"   # каждые 2 часа
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить цены
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_prices.py
      - name: Сохранить историю цен
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Обновить историю цен"
          git push
