name: Проверка цен

# Бот работает на своём сервере (install.sh), поэтому расписание выключено.
# Запуск вручную остаётся на случай, если сервер недоступен.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить сообщения и цены
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_prices.py
      - name: Сохранить данные
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Обновить данные бота"
          git pull --rebase origin main
          git push
