name: Проверка живых цен (временно)
on:
  push:
    branches: [probe-trains]
    paths: [probe/probe.py, .github/workflows/probe.yml, check_prices.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u probe/probe.py
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
